<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartNav | Interactive Campus Map & Navigation System</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="SmartNav | Interactive Campus Map & Navigation System" />
  <meta name="description" content="Explore campus floor plans, search rooms, locate faculty members, and get step-by-step turn-by-turn directions in real time." />
  <meta name="keywords" content="campus navigation, interactive floor plan, campus map, room finder, faculty directory, smart nav" />
  <meta name="author" content="SmartNav Team" />
  <meta name="theme-color" content="#090d16" />

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/website-logo.png" />
  <link rel="apple-touch-icon" href="/website-logo.png" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SmartNav | Interactive Campus Map & Navigation System" />
  <meta property="og:description" content="Explore campus floor plans, search rooms, locate faculty members, and get step-by-step turn-by-turn directions in real time." />
  <meta property="og:image" content="/website-logo.png" />

  <!-- Twitter Card -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="SmartNav | Interactive Campus Map & Navigation System" />
  <meta property="twitter:description" content="Explore campus floor plans, search rooms, locate faculty members, and get step-by-step turn-by-turn directions in real time." />
  <meta property="twitter:image" content="/website-logo.png" />

  <!-- Font Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Prevent FOUC (Flash of Unstyled Content) -->
  <script>
    (function() {
      try {
        var localTheme = localStorage.getItem('theme');
        var sysTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (localTheme === 'dark' || (!localTheme && sysTheme)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
