<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5eead4" />
      <stop offset="100%" stopColor="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Solid Dark Background (App Icon Style) -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0f172a" />
  
  <!-- Scaled up Central 3D Crystalline Compass Needle -->
  <path d="M50 12 L82 50 L50 88 L50 12 Z" fill="url(#grad-core)" />
  <path d="M50 12 L18 50 L50 88 L50 12 Z" fill="#0d9488" />
  
  <!-- Glowing Center Core -->
  <circle cx="50" cy="50" r="8" fill="#ffffff" filter="url(#glow)" />
</svg>
